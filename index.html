<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index of Unencoded Scripts</title>
<meta name="description" content="An index of scripts, marks and Chinese characters not yet in Unicode. Glyphs from Wikimedia Commons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f7f7f5; --ink:#111; --muted:#777; --yellow:#f5ff00; --orange:#ff6542; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; scroll-snap-type:y proximity; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } }
  body { background:var(--paper); color:var(--ink); font:14px/1.4 Inter, system-ui, -apple-system, sans-serif; }

  /* progress bar */
  #progress { position:fixed; top:0; left:0; height:4px; width:0; background:var(--orange); z-index:20; }

  /* letter nav */
  nav { position:fixed; top:50%; right:clamp(8px,2vw,28px); transform:translateY(-50%); z-index:10;
        display:flex; flex-direction:column; gap:4px; }
  nav a { display:grid; place-items:center; width:34px; height:34px; border:1px solid var(--ink);
          color:var(--ink); text-decoration:none; font-weight:700; font-size:13px; background:var(--paper);
          transition:background .15s, color .15s, transform .15s; }
  nav a:hover { transform:translateX(-3px); }
  nav a.active { background:var(--ink); color:var(--yellow); }
  nav a:focus-visible { outline:3px solid var(--orange); outline-offset:2px; }

  main { display:flex; flex-direction:column; align-items:center; padding:6vh 0 10vh; gap:6vh; }
  section { width:min(92vw, 860px, calc(92vh * 2132 / 3000 * 1.25)); scroll-snap-align:start; scroll-margin-top:3vh; position:relative; }
  section img { display:block; width:100%; height:auto; aspect-ratio:2132/3000; background:#eee;
                box-shadow:0 1px 0 rgba(0,0,0,.05), 0 12px 40px -18px rgba(0,0,0,.35);
                cursor:zoom-in; transition:transform .25s ease; }
  section .tag { position:absolute; left:-46px; top:0; font-weight:800; font-size:22px; color:var(--muted); }
  @media (max-width: 1000px) { section .tag { display:none; } nav a { width:28px; height:28px; font-size:11px; } }

  /* glyph hover (spec: Figma frame "ON HOVER EXAMPLE") */
  section { --cq: 1cqw; container-type: inline-size; }
  .glyphs { position:absolute; inset:0; pointer-events:none; }
  .glyph { position:absolute; pointer-events:auto; outline:none; cursor:default; }
  .glyph .zoom { position:absolute; left:0; top:0; width:100%; background-repeat:no-repeat;
                 transform-origin:21% 88%; mix-blend-mode:darken; transform:scale(1); opacity:0;
                 transition:transform .18s ease, opacity 0s .18s; }
  .glyph .cover { position:absolute; left:0; top:0; width:100%; background:var(--bg); opacity:0; }
  .glyph:hover .cover, .glyph:focus-visible .cover { opacity:1; z-index:1; }
  .glyph .num { position:absolute; left:0; font-family:Inter, system-ui, sans-serif; font-weight:700; color:#121212;
                background:var(--bg); padding-right:.25em; white-space:nowrap; opacity:0; letter-spacing:0; }
  .glyph:hover .zoom, .glyph:focus-visible .zoom { opacity:1; transform:scale(1.5619); z-index:2; transition:transform .18s ease, opacity 0s; }
  .glyph:hover .num, .glyph:focus-visible .num { opacity:1; color:#ff0000; z-index:3; }
  @media (prefers-reduced-motion: reduce) { .glyph .zoom { transition:none !important; } }
  section img { cursor:zoom-in; }

  /* lightbox */
  #lightbox { position:fixed; inset:0; background:rgba(17,17,17,.94); z-index:30; display:none; overflow:auto; cursor:zoom-out; }
  #lightbox.open { display:block; }
  #lightbox img { display:block; width:min(2132px, 180vw); margin:0 auto; }
  #lightbox .close { position:fixed; top:14px; right:18px; color:#fff; font:700 14px Inter, sans-serif; letter-spacing:.05em; }

  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 0 6vh; }
  .hint { position:fixed; left:16px; bottom:14px; font-size:11px; color:var(--muted); }
  @media (max-width: 700px) { .hint { display:none; } }
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<nav id="nav" aria-label="Frames"></nav>
<main id="frames"></main>
<footer>Glyphs: Wikimedia Commons, Category:Unencoded characters. Retrieved 23 November 2026. Licenses as listed in frame I.</footer>
<div class="hint">↑ ↓ or J / K to move between frames · click to zoom</div>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Zoomed frame"><span class="close">ESC ✕</span><img alt=""></div>

<script src="glyphs.js"></script>
<script>
// Frames are shown in alphabetical order. To add one: export it to frames/<Letter>.webp and add a line here.
const FRAMES = [
  { id:'A', alt:'Title page: Index of Unencoded Scripts' },
  { id:'B', alt:'Index of all scripts: in use, historical, invented, proposed marks and Chinese characters' },
  { id:'C', alt:'Scripts in use, glyphs 1 to 16' },
  { id:'D', alt:'Scripts in use, glyphs 17 to 32' },
  { id:'E', alt:'Historical scripts, glyphs 33 to 46' },
  { id:'F', alt:'Invented scripts and proposed marks, glyphs 47 to 65' },
  { id:'G', alt:'Chinese characters C1 to C75' },
  { id:'H', alt:'Chinese characters C76 to C150' },
  { id:'I', alt:'Credits and licenses' },
].sort((a,b) => a.id.localeCompare(b.id));

const main = document.getElementById('frames'), nav = document.getElementById('nav');
FRAMES.forEach((f, i) => {
  const s = document.createElement('section'); s.id = f.id;
  s.innerHTML = `<span class="tag">${f.id}</span><img src="frames/${f.id}.webp" alt="${f.alt}" width="2132" height="3000" ${i>1?'loading="lazy"':''} decoding="async">`;
  main.appendChild(s);
  addGlyphHovers(s, f.id);
  const a = document.createElement('a'); a.href = '#'+f.id; a.textContent = f.id; a.title = f.alt;
  nav.appendChild(a);
});

const sections = [...document.querySelectorAll('section')], links = [...nav.children];
let current = 0;
const setActive = i => { current = i; links.forEach((l,j) => l.classList.toggle('active', j===i)); };
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setActive(sections.indexOf(e.target)); }),
  { rootMargin:'-45% 0px -45% 0px' });
sections.forEach(s => io.observe(s));
setActive(0);

const bar = document.getElementById('progress');
addEventListener('scroll', () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (max > 0 ? scrollY / max * 100 : 0) + '%';
}, { passive:true });

const lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img');
main.addEventListener('click', e => {
  if (e.target.tagName !== 'IMG') return;
  lbImg.src = e.target.src; lbImg.alt = e.target.alt; lb.classList.add('open'); document.body.style.overflow = 'hidden';
});
const closeLb = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
lb.addEventListener('click', closeLb);

addEventListener('keydown', e => {
  if (lb.classList.contains('open')) { if (e.key === 'Escape') closeLb(); return; }
  const next = ['ArrowDown','j','PageDown'].includes(e.key), prev = ['ArrowUp','k','PageUp'].includes(e.key);
  if (!next && !prev) return;
  e.preventDefault();
  const i = Math.max(0, Math.min(sections.length - 1, current + (next ? 1 : -1)));
  setActive(i); // so rapid presses keep advancing
  sections[i].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
});
</script>
</body>
</html>
